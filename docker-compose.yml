services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  auth-org-service:
    build:
      context: .
      dockerfile: services/auth-org-service/Dockerfile
    environment:
      SERVICE_NAME: auth-org-service
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/llm_gateway?sslmode=disable
      JWT_SECRET: super-secret-dev-key
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 168h
      AUDIT_SERVICE_URL: http://audit-analytics-service:8085
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"

  project-key-service:
    build:
      context: .
      dockerfile: services/project-key-service/Dockerfile
    environment:
      SERVICE_NAME: project-key-service
      HTTP_ADDR: :8082
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/llm_gateway?sslmode=disable
      JWT_SECRET: super-secret-dev-key
      AUDIT_SERVICE_URL: http://audit-analytics-service:8085
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"

  limits-service:
    build:
      context: .
      dockerfile: services/limits-service/Dockerfile
    environment:
      SERVICE_NAME: limits-service
      HTTP_ADDR: :8083
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/llm_gateway?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: super-secret-dev-key
      AUDIT_SERVICE_URL: http://audit-analytics-service:8085
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083"

  provider-catalog-service:
    build:
      context: .
      dockerfile: services/provider-catalog-service/Dockerfile
    environment:
      SERVICE_NAME: provider-catalog-service
      HTTP_ADDR: :8084
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/llm_gateway?sslmode=disable
      JWT_SECRET: super-secret-dev-key
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: https://api.openai.com/v1/chat/completions
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8084"

  audit-analytics-service:
    build:
      context: .
      dockerfile: services/audit-analytics-service/Dockerfile
    environment:
      SERVICE_NAME: audit-analytics-service
      HTTP_ADDR: :8085
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/llm_gateway?sslmode=disable
      JWT_SECRET: super-secret-dev-key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8085:8085"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      SERVICE_NAME: api-gateway
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/llm_gateway?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_URL: https://api.openai.com/v1/chat/completions
      PROJECT_KEY_SERVICE_URL: http://project-key-service:8082
      LIMITS_SERVICE_URL: http://limits-service:8083
      PROVIDER_CATALOG_URL: http://provider-catalog-service:8084
      AUDIT_SERVICE_URL: http://audit-analytics-service:8085
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      project-key-service:
        condition: service_started
      limits-service:
        condition: service_started
      provider-catalog-service:
        condition: service_started
      audit-analytics-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      GATEWAY_SERVICE_URL: http://api-gateway:8080
      AUTH_SERVICE_URL: http://auth-org-service:8081
      PROJECT_SERVICE_URL: http://project-key-service:8082
      LIMITS_SERVICE_URL: http://limits-service:8083
      CATALOG_SERVICE_URL: http://provider-catalog-service:8084
      ANALYTICS_SERVICE_URL: http://audit-analytics-service:8085
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "3001:3001"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

volumes:
  pg_data:

networks:
  default:
    name: upprpo_default
    driver: bridge
    ipam:
      config:
        - subnet: 10.129.0.0/24
